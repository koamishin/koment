name: CI

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "main" ]
  merge_group:

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
# env:
#  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
#  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  build-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.1
        env:
          POSTGRES_USER: default
          POSTGRES_PASSWORD: default
          POSTGRES_DB: verceldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy env
        shell: bash
        run: |
          cp .env.example .env.local
          echo "POSTGRES_URL=postgresql://default:default@localhost:5432/verceldb" >> .env.local
          echo "NEXTAUTH_SECRET=ci-secret-12345678901234567890" >> .env.local
          echo "CLERK_SECRET_KEY=sk_test_ci_mock_secret_key" >> .env.local
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_bW9jay1jbGVyay1pbnN0YW5jZS5hY2NvdW50cy5kZXYk" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env.local

      - name: Setup bun
        uses: oven-sh/setup-bun@v1

      - name: Install lib
        run: bun i

      - name: Push db schema
        run: bun run db:push
        env:
          POSTGRES_URL: postgresql://default:default@localhost:5432/verceldb

      - name: Build
        run: bun run build
        env:
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: default
          POSTGRES_PASSWORD: default
          POSTGRES_DB: verceldb
          POSTGRES_URL: postgresql://default:default@localhost:5432/verceldb

      - name: Typecheck and Lint
        run: |
          bun run typecheck
          bun --cwd apps/nextjs lint
